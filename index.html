<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Turnero Digital 3</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="turnero">
      <div class="identificador">PANTALLA #1</div>

      <div class="fecha-hora">
        <div class="fecha" id="fecha"></div>
        <div class="hora" id="hora"></div>
      </div>

      <div class="numero-turno" id="turno">A001</div>
    </div>

    <div class="modal oculto" id="modalConfig">
      <div class="modal-contenido">
        <h2>CONFIGURACIÓN DE TURNOS</h2>

        <ul id="listaModos"></ul>

        <div class="modo-actual" id="modoActual"></div>

        <div class="ayuda">
          ↑ ↓ Navegar &nbsp; • &nbsp; ENTER Seleccionar &nbsp; • &nbsp; ESC
          Cerrar
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
